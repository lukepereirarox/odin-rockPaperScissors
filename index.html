<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="outcome">Win</div>
    <div id="selectedOption">
      <div id="userChoice">Rock</div>
      <div id="vs">vs</div>
      <div id="compChoice">Paper</div>
    </div>
    <div id="options">
      <button id="Rock" class="option">Rock</button>
      <button id="Paper" class="option">Paper</button>
      <button id="Scissors" class="option">Scissors</button>
    </div>
    <div id="score">
      <div id="humanScore">Your Score: 5</div>
      <div id="compScore">Computer's Score: 5</div>
    </div>

    <div id="finalWinner">You win the Game</div>
    <button id="replay" class="option">Play Again?</button>
    <script src="index.js"></script>
  </body>
</html>
